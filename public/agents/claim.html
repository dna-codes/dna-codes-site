<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Claim your DNA sandbox</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:36rem;margin:4rem auto;padding:0 1rem;color:#111}</style>
</head>
<body>
<h1>Claim your DNA sandbox</h1>
<p>Your agent registered a sandbox organization for you. Sign in to make it yours: it keeps its address and its DNA, and stops expiring.</p>
<p id="dna-claim-status" role="status">Starting…</p>
<noscript>This page needs JavaScript to sign you in. You can also claim the sandbox from any MCP client.</noscript>
<script type="application/json" id="dna-claim-config">{"clientId":"client_01M6NTD4ACP5VVAE63ZQ71AYDC","authorizationEndpoint":"https://just-bazaar-68.authkit.app/oauth2/authorize","tokenEndpoint":"https://just-bazaar-68.authkit.app/oauth2/token","base":"https://agents.dna.codes"}</script>
<script>window.dnaClaim = (async () => {
  const config = JSON.parse(document.getElementById("dna-claim-config").textContent);
  const status = document.getElementById("dna-claim-status");
  const show = (text) => { status.textContent = text; };
  const here = location.origin + location.pathname;
  const params = new URLSearchParams(location.search);
  const b64url = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const random = () => b64url(crypto.getRandomValues(new Uint8Array(32)));
  const claimEndpoint = (org) => config.base + "/o/" + encodeURIComponent(org) + "/claim";
  try {
    if (params.has("code") || params.has("error")) {
      const pending = JSON.parse(sessionStorage.getItem("dna-claim") || "null");
      sessionStorage.removeItem("dna-claim");
      history.replaceState(null, "", here);
      if (params.has("error")) return show("Signing in was refused: " + (params.get("error_description") || params.get("error")) + ". Open the claim link again to retry.");
      if (!pending || params.get("state") !== pending.state) return show("This sign-in does not match a claim started on this page. Open the claim link again.");
      const tokenResponse = await fetch(config.tokenEndpoint, {
        method: "POST",
        headers: { "content-type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ grant_type: "authorization_code", code: params.get("code"), redirect_uri: here, client_id: config.clientId, code_verifier: pending.verifier }).toString()
      });
      const tokens = await tokenResponse.json().catch(() => ({}));
      if (!tokenResponse.ok || !tokens.access_token) return show("Signing in failed (" + (tokens.error || tokenResponse.status) + "). You can also claim the sandbox from any MCP client.");
      const claimResponse = await fetch(claimEndpoint(pending.org), {
        method: "POST",
        headers: { authorization: "Bearer " + tokens.access_token, "content-type": "application/json" },
        body: JSON.stringify({ claim_token: pending.claimToken })
      });
      const answer = await claimResponse.json().catch(() => ({}));
      if (claimResponse.ok) return show("Claimed. The organization " + answer.organization + " is yours, and its agent keeps working at " + answer.endpoint + ".");
      const refusal = answer.refusal || {};
      return show((refusal.message || "The claim was refused (" + claimResponse.status + ").") + (refusal.next ? " " + refusal.next : ""));
    }
    const org = params.get("org");
    const claimToken = new URLSearchParams(location.hash.slice(1)).get("claim_token");
    if (!org || !claimToken) return show("Open the full claim link your agent gave you; this one is incomplete.");
    history.replaceState(null, "", here + "?org=" + encodeURIComponent(org));
    const verifier = random();
    const state = random();
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))));
    sessionStorage.setItem("dna-claim", JSON.stringify({ org, claimToken, verifier, state }));
    const authorize = new URL(config.authorizationEndpoint);
    const query = { response_type: "code", client_id: config.clientId, redirect_uri: here, code_challenge: challenge, code_challenge_method: "S256", state, scope: "openid", resource: claimEndpoint(org) };
    for (const [key, value] of Object.entries(query)) authorize.searchParams.set(key, value);
    show("Signing you in…");
    location.assign(authorize.href);
  } catch (error) {
    show("The claim could not be completed: " + (error && error.message ? error.message : String(error)));
  }
})();</script>
</body>
</html>
