<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Companion app for the talk Building With AI: Patterns and Anti-patterns. Watch the software lifecycle's bottleneck move from Pre-AI to Now to Future.">
<link rel="icon" href="/favicon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Building With AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: header (brand · time toggle · actions) / ring + panel / footer. The ring carries phases, handoff gates, sub-stage effort ticks and a flow of work that piles up at the bottleneck for the selected mode. dna.codes look, dark-first, high contrast in both themes. */
:root{
  --bg:#0A0F1E; --surface:#0F1729; --surface-2:#121C33;
  --fg:#EEF3FA; --heading:#FFFFFF; --muted:#BAC4D4; --soft:#DCE4EF;
  --line:rgba(229,236,246,.16); --line-strong:rgba(229,236,246,.3);
  --accent:#2DD4BF; --accent-text:#5EEAD4; --accent-strong:#0F766E; --on-accent:#FFFFFF;
  --accent-soft:rgba(45,212,191,.16); --accent-line:rgba(45,212,191,.6);
  --rose:#FDB4BE; --rose-line:rgba(251,113,133,.6); --rose-soft:rgba(244,63,94,.12);
  --warn:#FCD34D; --warn-soft:rgba(252,211,77,.16); --warn-line:rgba(252,211,77,.7);
  --seg-fill:rgba(45,212,191,.08); --seg-line:rgba(45,212,191,.55); --seg-active:rgba(45,212,191,.28);
  --chip-bg:rgba(229,236,246,.06); --shadow:rgba(0,0,0,.6); --dot:#5EEAD4;
  --font-sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#FFFFFF;
    --fg:#111827; --heading:#060B18; --muted:#3B4657; --soft:#1F2937;
    --line:rgba(11,19,36,.16); --line-strong:rgba(11,19,36,.32);
    --accent:#0D9488; --accent-text:#0B5D57; --accent-strong:#0B5D57; --on-accent:#FFFFFF;
    --accent-soft:rgba(13,148,136,.12); --accent-line:rgba(13,148,136,.65);
    --rose:#9F1239; --rose-line:rgba(190,18,60,.55); --rose-soft:rgba(225,29,72,.08);
    --warn:#92400E; --warn-soft:rgba(217,119,6,.14); --warn-line:rgba(180,83,9,.75);
    --seg-fill:rgba(13,148,136,.07); --seg-line:rgba(13,148,136,.6); --seg-active:rgba(13,148,136,.2);
    --chip-bg:rgba(11,19,36,.04); --shadow:rgba(15,23,42,.18); --dot:#0D9488;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F7FA; --surface:#FFFFFF; --surface-2:#FFFFFF;
  --fg:#111827; --heading:#060B18; --muted:#3B4657; --soft:#1F2937;
  --line:rgba(11,19,36,.16); --line-strong:rgba(11,19,36,.32);
  --accent:#0D9488; --accent-text:#0B5D57; --accent-strong:#0B5D57; --on-accent:#FFFFFF;
  --accent-soft:rgba(13,148,136,.12); --accent-line:rgba(13,148,136,.65);
  --rose:#9F1239; --rose-line:rgba(190,18,60,.55); --rose-soft:rgba(225,29,72,.08);
  --warn:#92400E; --warn-soft:rgba(217,119,6,.14); --warn-line:rgba(180,83,9,.75);
  --seg-fill:rgba(13,148,136,.07); --seg-line:rgba(13,148,136,.6); --seg-active:rgba(13,148,136,.2);
  --chip-bg:rgba(11,19,36,.04); --shadow:rgba(15,23,42,.18); --dot:#0D9488;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;padding-inline:clamp(0px,2vw,32px);border-bottom:1px solid var(--line);flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand-logo{display:flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:8px}
.brand-mark{display:block;transform:rotate(45deg)}
.brand-sep{width:1px;height:20px;background:var(--line-strong)}
.brand-talk{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;cursor:pointer}
.brand-talk:hover{color:var(--fg)}
.modes{display:flex;padding:4px;border-radius:999px;border:1px solid var(--line-strong);background:var(--chip-bg);gap:2px}
.mode-btn{min-height:36px;padding:0 16px;border-radius:999px;border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.mode-btn:hover{color:var(--heading)}
.mode-btn[aria-pressed="true"]{background:var(--accent-strong);color:var(--on-accent)}
.mode-btn small{font-weight:500;opacity:.85;margin-left:4px;font-size:12px}
.top-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn:hover{border-color:var(--accent-line);color:var(--accent-text)}
.pill-btn{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-text);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.pill-btn[aria-pressed="true"],.pill-btn[aria-expanded="true"]{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--on-accent)}

/* Main split */
.stage-layout{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(28px,4vw,72px);padding-block:20px;padding-inline:clamp(0px,2.5vw,48px);overflow:auto;min-height:0}
.stage-layout[data-view="overview"]{--ring:min(calc(70vh * 1.2),52vw,860px)}
.stage-layout[data-view="phase"],.stage-layout[data-view="sub"]{--ring:min(calc(52vh * 1.2),36vw,580px);align-items:start}
.stage-layout[data-view="tips"]{grid-template-columns:minmax(0,1fr);align-items:start}
.stage-layout[data-view="tips"] .ring-wrap{display:none}
.ring-wrap{width:var(--ring);max-width:100%;transition:width .5s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;gap:10px;align-items:center}
.stage-layout[data-view="phase"] .ring-wrap,.stage-layout[data-view="sub"] .ring-wrap{position:sticky;top:0;align-self:start;padding-top:8px}
.ring{display:block;width:100%;height:auto;overflow:visible}
.flow-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 26px;font-size:18px}
.stat{position:relative;display:inline-flex;align-items:center;gap:8px;color:var(--accent-text);cursor:help;padding:4px 6px;border-radius:8px}
.stat b{color:var(--heading);font-weight:700;font-variant-numeric:tabular-nums}
.stat:hover,.stat:focus-visible{background:var(--accent-soft)}
.stat::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);width:max-content;max-width:240px;padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--accent-line);box-shadow:0 12px 30px var(--shadow);color:var(--fg);font-size:13px;font-weight:500;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.stat:hover::after,.stat:focus-visible::after{opacity:1}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;border-radius:50%}

.seg,.gate{cursor:pointer;outline:none}
.seg path{fill:var(--seg-fill);stroke:var(--seg-line);stroke-width:1.4;transition:fill .2s,stroke .2s}
.seg:hover path{fill:var(--accent-soft);stroke:var(--accent)}
.seg.active path{fill:var(--seg-active);stroke:var(--accent);stroke-width:2.5}
.seg.bn path{stroke:var(--warn);stroke-width:2.5;stroke-dasharray:7 5}
.seg:focus-visible path,.gate:focus-visible circle{stroke:var(--heading);stroke-width:3}
.seg .num{font-family:var(--font-mono);font-size:13px;fill:var(--accent-text);letter-spacing:1px}
.seg .name{font-family:var(--font-sans);font-size:20px;font-weight:700;fill:var(--heading);letter-spacing:-.3px}
.track{fill:none;stroke:var(--line-strong);stroke-width:1;stroke-dasharray:2 6}
.flow-dot{fill:var(--dot)}
@keyframes dotin{from{opacity:0}to{opacity:1}}
.flow-dot{animation:dotin .6s ease-out}
.flow-dot.ret{fill:var(--bg);stroke:var(--dot);stroke-width:1.8}
.loop-track{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round}
.loop-chev{fill:var(--accent);stroke:var(--bg);stroke-width:2;stroke-linejoin:round}
.loop-head{fill:var(--accent)}
.loop-label{font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:1.5px;fill:var(--accent-text)}
.subn{cursor:pointer;outline:none}
.subn .hit{fill:transparent}
.subn .node{stroke:var(--accent);stroke-width:2;transition:stroke .2s,fill .2s}
.subn.e1 .node{fill:var(--bg)}
.subn.e2 .node{fill:var(--accent);fill-opacity:.45}
.subn.e3 .node{fill:var(--accent)}
.subn .slabel{font-family:var(--font-sans);font-size:15.5px;font-weight:600;fill:var(--fg);transition:fill .2s}
.subn:hover .node{stroke:var(--heading);stroke-width:3}
.subn:hover .slabel{fill:var(--accent-text)}
.subn:focus-visible .node{stroke:var(--heading);stroke-width:3.5}
.subn:focus-visible .slabel{text-decoration:underline}
.subn.bn .node{stroke:var(--warn);fill:var(--warn);fill-opacity:1}
.subn.bn .slabel{fill:var(--warn)}
.subn .halo{fill:none;stroke:var(--warn);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;pointer-events:none}
.subn.bn-main .halo{animation:halo 2.2s ease-out infinite}
@keyframes halo{0%{transform:scale(.9);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.subn.active .node{stroke:var(--heading);stroke-width:3.5}
.subn.active .slabel{fill:var(--heading);text-decoration:underline;text-underline-offset:4px}
.subn.bn.active .slabel{fill:var(--warn)}
.bn-tag{font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:1.5px;fill:var(--warn);pointer-events:none}
.lg{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);box-sizing:border-box}
.lg.e1{background:var(--bg)}
.lg.e2{background:var(--accent-soft);width:14px;height:14px}
.lg.e3{background:var(--accent);width:16px;height:16px}
.lg.bn{background:var(--warn);border-color:var(--warn)}
.lg.ret{width:9px;height:9px;border-width:1.8px;background:var(--bg)}
.c-eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:2.5px;fill:var(--muted)}
.c-big{font-family:var(--font-sans);font-size:40px;font-weight:700;letter-spacing:-1.2px;fill:var(--heading)}
.c-small{font-family:var(--font-sans);font-size:15px;fill:var(--muted)}
.c-num{font-family:var(--font-mono);font-size:54px;font-weight:600;fill:var(--accent-text)}
.c-name{font-family:var(--font-mono);font-size:14px;letter-spacing:2.5px;fill:var(--muted)}
.stage-layout[data-view="overview"] .ctr-stop,.stage-layout[data-view="phase"] .ctr-over,.stage-layout[data-view="sub"] .ctr-over{display:none}

/* Panel */
.panel{min-width:0;max-width:960px;display:flex;flex-direction:column;gap:22px;padding-bottom:12px}
.stage-layout[data-view="tips"] .panel{max-width:1240px;margin-inline:auto;width:100%}
.panel.swap{animation:rise .35s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.eyebrow-pill{padding:5px 13px;border-radius:999px;border:1px solid var(--accent-line);color:var(--accent-text);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.bn-pill{padding:5px 13px;border-radius:999px;border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.bet-pill{padding:5px 13px;border-radius:999px;border:1px dashed var(--line-strong);color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;color:var(--accent-text);text-transform:uppercase}
h1,h2,h3,h4{margin:0;color:var(--heading);text-wrap:balance}
h1{font-size:clamp(34px,4vw,60px);line-height:1.04;font-weight:700;letter-spacing:-.04em}
h1 .hl{color:var(--accent-text)}
h2{font-size:clamp(28px,2.8vw,42px);line-height:1.08;font-weight:700;letter-spacing:-.035em}
.lede{margin:0;font-size:clamp(17px,1.4vw,20px);line-height:1.5;color:var(--soft);max-width:60ch}
.head{display:flex;flex-direction:column;gap:10px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fact{padding:16px 18px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.fact.warn{border-color:var(--warn-line);background:var(--warn-soft)}
.fact .label{font-size:11px}
.fact.warn .label{color:var(--warn)}
.fact p{margin:0;font-size:16px;line-height:1.45;color:var(--heading)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
.btn-primary{min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--accent-strong);color:var(--on-accent);font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--fg);font-size:15px;font-weight:500;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.btn-ghost:hover{border-color:var(--accent-line)}
.btn-warn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--warn-line);background:var(--warn-soft);color:var(--warn);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.label{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.block{display:flex;flex-direction:column;gap:12px}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.sub{padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.sub:hover{border-color:var(--accent)}
.sub.hand{border-style:dashed}
.sub.bn{border-color:var(--warn-line);background:var(--warn-soft);border-style:solid}
.sub-kind{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text)}
.bn-pill.sm{padding:3px 9px;font-size:10.5px}
.eras{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.era{padding:14px 16px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.era:hover{border-color:var(--accent)}
.era[aria-pressed="true"]{border-color:var(--accent);border-width:2px;padding:13px 15px;background:var(--accent-soft)}
.era.bn{border-color:var(--warn-line)}
.era.bn[aria-pressed="true"]{background:var(--warn-soft)}
.era-name{font-size:16px;font-weight:700;color:var(--heading)}
.none{margin:0;padding:16px 18px;border-radius:14px;border:1px dashed var(--line-strong);font-size:15px;color:var(--muted)}
.sub h4{font-size:16px;font-weight:600}
.sub p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.bars{display:flex;gap:3px}
.bars b{width:18px;height:6px;border-radius:3px;background:var(--line-strong)}
.bars b.on{background:var(--accent)}
.meter span{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.handed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--chip-bg);color:var(--fg);font-size:15px;display:inline-flex;align-items:center}
.chip.term{cursor:help}
.chip.term span{border-bottom:1.5px dotted var(--accent);padding-bottom:1px}
.chip.term:hover,.chip.term[aria-expanded="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--heading)}
.term:not(.chip){display:inline;padding:0 1px;margin:0;border:0;border-bottom:1.5px dotted var(--accent);border-radius:0;background:none;color:var(--heading);font:inherit;cursor:help}
.term:not(.chip):hover,.term:not(.chip)[aria-expanded="true"]{background:var(--accent-soft);border-radius:3px 3px 0 0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.col-head .count{font-family:var(--font-mono);font-weight:500;letter-spacing:0;opacity:.85}
.col-head.good{color:var(--accent-text)}
.col-head.bad{color:var(--rose)}
.card{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--accent-line);display:flex;flex-direction:column;gap:7px}
.card.bad{border-color:var(--rose-line)}
.card.bet{border-style:dashed}
.card h4{font-size:17px;font-weight:600;letter-spacing:-.015em}
.card p{margin:0;font-size:15px;line-height:1.5;color:var(--soft)}
.tag{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.02em}
.tag b{font-weight:500;color:var(--accent-text)}
.card.bad .tag b{color:var(--rose)}
.loc{align-self:flex-start;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:2px 8px;border-radius:999px;border:1px solid var(--line-strong)}
.stop-nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:26px;height:24px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center}
.dot::before{content:"";display:block;width:100%;height:4px;border-radius:4px;background:var(--line-strong)}
.dot.g{width:14px}
.dot.g::before{height:8px;width:8px;border-radius:50%;margin:auto}
.dot[aria-current="step"]::before{background:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filter{min-height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:none;color:var(--fg);font-size:14px;cursor:pointer}
.filter[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--heading);font-weight:600}
.tips-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}

/* Footer */
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:56px;padding-inline:clamp(0px,2vw,32px);padding-block:8px;border-top:1px solid var(--line)}
.xc{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;color:var(--warn)}
.xc-text{font-size:15px;color:var(--fg)}
.keys{margin-left:auto;display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
kbd{font-family:var(--font-mono);font-size:11px;padding:2px 6px;margin-right:5px;border-radius:5px;border:1px solid var(--line-strong);color:var(--fg)}

/* Popover */
.pop{position:fixed;z-index:50;width:min(400px,calc(100vw - 32px));box-sizing:border-box;padding:18px 20px;border-radius:16px;background:var(--surface-2);border:1px solid var(--accent-line);box-shadow:0 24px 60px var(--shadow);display:flex;flex-direction:column;gap:12px;--caret-x:28px}
.pop .caret{position:absolute;top:-7px;left:var(--caret-x);width:12px;height:12px;background:var(--surface-2);border-left:1px solid var(--accent-line);border-top:1px solid var(--accent-line);transform:rotate(45deg)}
.pop.above .caret{top:auto;bottom:-7px;border:0;border-right:1px solid var(--accent-line);border-bottom:1px solid var(--accent-line)}
.pop-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pop-title{font-size:18px;font-weight:600;letter-spacing:-.015em;color:var(--heading)}
.type-pill{flex-shrink:0;padding:2px 9px;border-radius:999px;border:1px solid var(--accent-line);font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--accent-text);text-transform:uppercase}
.pop p{margin:0}
.pop-def{font-size:15px;line-height:1.5;color:var(--fg)}
.sec{display:flex;flex-direction:column;gap:4px}
.sec .label{font-size:11px}
.sec .label.rose{color:var(--rose)}
.sec p{font-size:14px;line-height:1.5;color:var(--soft)}
.rule{height:1px;background:var(--line)}
.pop-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pop-stages{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.link-btn{padding:0;border:0;background:none;color:var(--accent-text);font-size:13px;font-weight:600;cursor:pointer}
.link-btn:hover{text-decoration:underline}
.pop-hint{font-size:12px;color:var(--muted)}

/* Glossary drawer */
.drawer{position:fixed;z-index:40;top:0;right:0;bottom:0;width:min(460px,100vw);box-sizing:border-box;background:var(--surface);border-left:1px solid var(--line-strong);box-shadow:-24px 0 60px var(--shadow);display:flex;flex-direction:column;gap:14px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,calc(env(safe-area-inset-right,0px) + 16px));transform:translateX(100%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s linear .32s}
.drawer.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.7,.2,1),visibility 0s}
.drawer-head{display:flex;align-items:center;justify-content:space-between}
.drawer-title{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--heading);margin:0}
.search{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.search input{height:44px;box-sizing:border-box;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.drawer .filter{min-height:32px;padding:0 12px;font-size:13px}
.g-count{font-size:12px;color:var(--muted)}
.g-list{flex:1;overflow:auto;margin-inline:-12px;padding-inline:12px;min-height:0}
.g-item{border-bottom:1px solid var(--line)}
.g-item.open{margin:6px -12px;padding:0 12px 14px;border:1px solid var(--accent-line);border-radius:12px;background:var(--accent-soft)}
.g-head{width:100%;padding:12px 0;border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.g-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.g-name{font-size:15px;font-weight:600;color:var(--heading)}
.g-st{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.g-short{font-size:13px;line-height:1.45;color:var(--muted)}
.g-body{display:flex;flex-direction:column;gap:10px}
.g-body > p{margin:0;font-size:14px;line-height:1.5;color:var(--fg)}
.seen{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mini{min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--accent-line);background:var(--surface);color:var(--accent-text);font-size:12px;font-weight:600;cursor:pointer}
.empty{padding:24px 0;font-size:14px;color:var(--muted)}

@media (max-width:1180px){ .brand-talk,.brand-sep{display:none} .facts{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .stage-layout{grid-template-columns:minmax(0,1fr);justify-items:center;align-items:start;padding-inline:0}
  .stage-layout[data-view="overview"]{--ring:min(94vw,480px)}
  .stage-layout[data-view="phase"],.stage-layout[data-view="sub"]{--ring:min(86vw,360px)}
  .stage-layout[data-view="phase"] .ring-wrap,.stage-layout[data-view="sub"] .ring-wrap{position:static}
  .eras{grid-template-columns:minmax(0,1fr)}
  .panel{width:100%}
  .cols,.handed{grid-template-columns:minmax(0,1fr)}
  .keys{display:none}
  .top{justify-content:center}
}
@media (max-width:520px){ .mode-btn small{display:none} .mode-btn{padding:0 12px} .pill-btn .lbl{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

(function(){
/* =================== CONTENT =================== */
const MODE_ORDER = ["pre","now","future"];
/* Bottlenecks point at a sub-stage: p = phase index, k = sub-stage index. s = how hard it slows the flow. */
const MODES = {
  pre: { label:"Pre-AI", story:"Ideas were cheap. Turning them into working software was expensive.",
    cheap:"Ideas", piles:"Writing usable requirements, implementation capacity, and deployment",
    cope:"Agile, smaller batches, CI/CD, DevOps",
    n:26, lap:18, loop:.45, bottlenecks:[ {p:2,k:0,s:1,label:"BOTTLENECK"}, {p:1,k:0,s:.6}, {p:3,k:0,s:.6} ] },

};

const PHASES = [
 { id:"discover", name:"Discover",
   subs:[
    {short:"Framing", name:"Problem framing", what:"Deciding which problem is worth solving", e:{pre:2,now:2,future:3}},
    {short:"Research", name:"User research", what:"Learning what people actually need", e:{pre:3,now:2,future:2}},
    {short:"Ideation", name:"Ideation", what:"Generating possible solutions", e:{pre:1,now:1,future:1}},
    {short:"Prioritize", name:"Prioritization", what:"Choosing what to pursue", e:{pre:2,now:3,future:3}},
    {short:"Brief", name:"The brief", what:"Handing the opportunity to Design", e:{pre:2,now:2,future:3}, gate:0} ],
   modes:{
    pre:{ thesis:"Ideas were cheap. Testing them was not.",
      tools:["User interviews","Paper prototypes","Market research","Roadmap planning"],
      patterns:[{k:1,title:"Validate before building", desc:"Interviews and paper prototypes come before any code.", old:"Lean startup, customer development"}],
      anti:[{k:3,title:"Building to find out", desc:"Expensive bets get placed on opinion.", warn:"The roadmap is whoever spoke loudest"}] },
    now:{ thesis:"Prototypes got cheap enough to be research.",
      tools:["vibe-coding","rapid-prototyping","deep-research","feedback-synthesis","synthetic-users","voice-prompting"],
      patterns:[
       {k:1,title:"Prototype to learn", desc:"Build a throwaway version in a day with [[vibe-coding|vibe coding]] and put it in front of real users. The prototype is a question, not a product.", old:"Rapid prototyping, spikes"},
       {k:2,title:"Many cheap bets", desc:"Generate several directions instead of debating one. Let real reactions pick the winner.", old:"Set-based design"},
       {k:1,title:"Research at the speed of questions", desc:"Use [[deep-research|deep research]] and interview synthesis to answer a question in hours. Then open the sources yourself.", old:"Desk research, affinity mapping"},
       {k:0,title:"Customer words in the context", desc:"Real quotes, tickets and interview notes go into the brief that people and agents read.", old:"Voice of the customer"} ],

       {k:1,title:"Unverified research", desc:"Generated summaries with missing or invented sources drive decisions.", warn:"Nobody opened the sources"},
       {k:3,title:"Idea flood", desc:"Generating fifty ideas replaces deciding on one.", warn:"The backlog grows and nothing gets cut"} ] },
    future:{ thesis:"When anything can be built, choosing is the work.",

 { id:"design", name:"Design",
   subs:[
    {short:"Requirements", name:"Requirements analysis", what:"Turning needs into clear, testable requirements", e:{pre:3,now:2,future:3}},
    {short:"Systems", name:"Systems design", what:"Architecture, data, integrations, tradeoffs", e:{pre:3,now:2,future:2}},
    {short:"UX", name:"UX design", what:"Flows, screens, interactions", e:{pre:3,now:2,future:1}},
    {short:"Planning", name:"Planning", what:"Breaking work down and sequencing it", e:{pre:3,now:1,future:1}},
    {short:"Spec", name:"The spec", what:"Handing the plan to Develop", e:{pre:2,now:3,future:3}, gate:1} ],
   modes:{
    pre:{ thesis:"Requirements were the first traffic jam.",
      tools:["PRDs","adrs","Wireframes","UML diagrams","Estimation"],

      anti:[{k:0,title:"Big design up front", desc:"Months of specs before anyone learns anything.", warn:"The spec was approved, then reality changed"}] },
    now:{ thesis:"Specs have a second reader now.",
      tools:["context-engineering","spec-driven-development","agent-skills","voice-prompting","adrs","design-alternatives","prompt-files","ux-mockups"],
      patterns:[

       {k:1,title:"Compare before committing", desc:"Ask for three [[design-alternatives|architectures with tradeoffs]], then choose. Alternatives cost minutes now, not weeks.", old:"Design reviews, trade studies"},
       {k:0,title:"Talk, then tighten", desc:"Use [[voice-prompting|voice prompting]] to get everything said, edge cases included. Then have the model turn it into a spec you review.", old:"Whiteboarding with a colleague"},
       {k:2,title:"React to mockups, not descriptions", desc:"Generate several [[ux-mockups|screens]] and critique them before anyone builds.", old:"Wireframes, design critiques"},
       {k:3,title:"Plan in agent-sized tasks", desc:"Break work into tasks an agent can finish and a person can review in one sitting.", old:"User stories"},
       {k:4,title:"Encode conventions as skills", desc:"Package how your team does recurring work as [[agent-skills|agent skills]], so every agent follows the same playbook.", old:"Runbooks, style guides"} ],
      anti:[

       {k:0,title:"Transcript as spec", desc:"A raw, rambling transcript goes straight to an agent, mis-heard terms and contradictions included.", warn:"The agent built what you said, not what you meant"},
       {k:2,title:"Default-looking UI", desc:"Generated screens get accepted as they come.", warn:"It looks like every other app"},
       {k:3,title:"Planning for the old bottleneck", desc:"Plans still assume coding is the long pole, so review and testing get no time.", warn:"The sprint has no review capacity in it"},

 { id:"develop", name:"Develop",

   modes:{

      patterns:[{k:2,title:"Small batches, continuous integration", desc:"Merge daily and keep the build green.", old:"Extreme Programming"}],
      anti:[{k:0,title:"Hero coding", desc:"One person writes and understands the critical module.", warn:"Everyone waits for the same developer"}] },
    now:{ thesis:"Generation is cheap. Review isn’t.",
      tools:["coding-agents","agent-skills","agentic-loops","vibe-coding","test-generation","ai-code-review","parallel-agents","voice-prompting"],
      patterns:[
       {k:1,title:"Loops with verification", desc:"[[agentic-loops|Agents iterate]] against tests, types and linters. The loop ends when checks pass, not when code exists.", old:"TDD, CI"},
       {k:1,title:"Tests first, then generate", desc:"Write or approve the tests before asking for the code, so the agent has a target it can’t argue with.", old:"Test-driven development"},
       {k:0,title:"One agent, one task, one branch", desc:"Run [[parallel-agents|parallel agents]] only on isolated, well-scoped tasks.", old:"Work breakdown"},
       {k:2,title:"Integrate agent work daily", desc:"Merge agent branches often, so conflicts show up while they’re small.", old:"Continuous integration"},
       {k:3,title:"Cleanup passes under test", desc:"Use agents to refactor and pay down debt, with tests holding behavior steady.", old:"The boy scout rule"},
       {k:4,title:"Small, reviewable diffs", desc:"Ask for changes a person can actually read in one sitting. Merge often.", old:"Trunk-based development"} ],
      anti:[
       {k:0,title:"Volume as productivity", desc:"Lines generated becomes the metric. Review becomes the bottleneck and quality drifts.", warn:"The PR queue grows faster than merges"},

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rich = str => esc(str).replace(/\[\[([\w-]+)\|([^\]]+)\]\]/g, (m,id,label)=>
  TERMS[id] ? `<button type="button" class="term" data-term="${id}" aria-expanded="false">${label}</button>` : label);
const bnAt = (p,k,m=mode) => MODES[m].bottlenecks.find(b=>b.p===p && b.k===k);
const bnWord = b => b.label === "NEXT" ? "Next bottleneck" : b.label === "LATER" ? "Later bottleneck" : "Bottleneck";
const subAng = (p,k) => p*90 - 34 + k*17;
const SUBS = []; PHASES.forEach((p,i)=>p.subs.forEach((s,k)=>SUBS.push([i,k])));

/* =================== RING =================== */
const C = 300, R1 = 152, R2 = 238, RT = 128, RS = 262, RL = 286, RL0 = 137;
/* The feedback loop: the stretch of track from Deliver\u2019s last step back to Discover\u2019s first. */
const LOOP0 = 306, LOOP1 = 325;
const inLoop = th => th >= LOOP0 && th < LOOP1;
const P = (r,deg)=>{ const a = deg*Math.PI/180; return [+(C + r*Math.sin(a)).toFixed(2), +(C - r*Math.cos(a)).toFixed(2)]; };
const segPath = a => { const s = 42; const [x1,y1]=P(R2,a-s),[x2,y2]=P(R2,a+s),[x3,y3]=P(R1,a+s),[x4,y4]=P(R1,a-s);
  return `M${x1} ${y1}A${R2} ${R2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${R1} ${R1} 0 0 0 ${x4} ${y4}Z`; };

function buildRing(){
  let h = `<svg class="ring" viewBox="-115 -42 830 686" role="group" aria-label="Software lifecycle: four phases, each with five sub-stages">`;
  const [m0x,m0y] = P(RT,LOOP1), [m1x,m1y] = P(RT,LOOP0), [l0x,l0y] = P(RT,LOOP0+1), [l1x,l1y] = P(RT,LOOP1-2);
  const [t0x,t0y] = P(RL0,298), [t1x,t1y] = P(RL0,334);
  h += `<defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="loop-head"/></marker>
    <path id="loop-label-path" d="M${t0x} ${t0y}A${RL0} ${RL0} 0 0 1 ${t1x} ${t1y}"/>
</defs>
    <path class="track" d="M${m0x} ${m0y}A${RT} ${RT} 0 1 1 ${m1x} ${m1y}"/>
    <path class="loop-track" d="M${l0x} ${l0y}A${RT} ${RT} 0 0 1 ${l1x} ${l1y}" marker-end="url(#loop-arrow)"/>
    <text class="loop-label"><textPath href="#loop-label-path" startOffset="50%" text-anchor="middle">FEEDBACK</textPath></text>
    <g id="flow"></g>`;
  PHASES.forEach((p,i)=>{
    const a = i*90, [lx,ly] = P(195,a);
    h += `<g class="seg" data-phase="${i}" role="button" tabindex="0" aria-label="Phase ${i+1}: ${p.name}">
      <path d="${segPath(a)}"/>
      <text class="num" x="${lx}" y="${ly-10}" text-anchor="middle">${pad(i+1)}</text>
      <text class="name" x="${lx}" y="${ly+15}" text-anchor="middle">${p.name}</text></g>`;
  });
  PHASES.forEach((p,i)=>p.subs.forEach((s,k)=>{
    const a = subAng(i,k), [nx,ny] = P(RS,a), [tx,ty] = P(RL,a);
    const sn = Math.sin(a*Math.PI/180), cs = Math.cos(a*Math.PI/180);
    const anchor = sn > .35 ? "start" : sn < -.35 ? "end" : "middle";
    const dy = cs > .5 ? -4 : cs < -.5 ? 16 : 5;
    const tagDy = cs > .5 ? -21 : 21;
    h += `<g class="subn" data-sub="${i}-${k}" role="button" tabindex="0" aria-label="${esc(p.name)}: ${esc(s.name)}">
      <circle class="hit" cx="${nx}" cy="${ny}" r="18"/>
      <circle class="halo" cx="${nx}" cy="${ny}" r="13"/>
      <circle class="node" cx="${nx}" cy="${ny}" r="9"/>
      <text class="slabel" x="${tx}" y="${ty+dy}" text-anchor="${anchor}">${esc(s.short)}</text>
      <text class="bn-tag" x="${tx}" y="${ty+dy+tagDy}" text-anchor="${anchor}"></text></g>`;
  }));

/* Flow: dots move clockwise. Each era has its own volume (dots in flight) and lap time (time to ship).
   Speed drops at bottleneck sub-stages, so dots pile up there (density ~ 1/speed).
   Calibrated so that in Now, dots move 8x faster through Implement than in Pre-AI, but finish a lap only 1.3x faster. */
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const dots = [];
function shape(th, m){
  let slow = 0;
  for (const b of MODES[m].bottlenecks){
    const at = subAng(b.p,b.k);
    let d = ((th - (at - 4)) % 360 + 540) % 360 - 180;
    slow += b.s * .9 * Math.exp(-((d/11)*(d/11)));
  }
  return (inLoop(th) ? MODES[m].loop : 1) * Math.max(.06, 1 - slow);
}
const timeOver = (m, a, b) => { let t = 0; const N = 900; for (let i=0;i<N;i++) t += (b-a)/N / shape(a + (i+.5)*(b-a)/N, m); return t; };
const BASE = {};
const calibrate = () => { MODE_ORDER.forEach(m=>{ BASE[m] = timeOver(m,0,360) / MODES[m].lap; }); };
const IMPL = subAng(2,0);
const codeSpeed = m => 17 / (timeOver(m, IMPL-8.5, IMPL+8.5) / BASE[m]);
(function tune(){
  let lo = .3, hi = 1.3;
  for (let i=0;i<32;i++){ const x = (lo+hi)/2; MODES.pre.bottlenecks[0].s = x; calibrate(); (codeSpeed("now")/codeSpeed("pre") > 8) ? hi = x : lo = x; }
  calibrate();
})();
const speed = th => BASE[mode] * shape(th, mode);
function steadyPositions(n){
  const N = 720, w = []; let sum = 0;
  for (let k=0;k<N;k++){ const v = 1/speed(k*360/N); w.push(v); sum += v; }
  const out = []; let acc = 0, k = 0;
  for (let d=0; d<n; d++){
    const target = (d + .5) / n * sum;
    while (k < N-1 && acc + w[k] < target){ acc += w[k]; k++; }
    out.push(k*360/N);
  }
  return out;
}
function initDots(){
  flowG.innerHTML = ""; dots.length = 0;
  steadyPositions(MODES[mode].n).forEach(th=>{
    const c = document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("class","flow-dot"); c.setAttribute("r","4");
    flowG.appendChild(c); dots.push({th, el:c, ret:false});
  });
  drawDots();
  const st = $("#flow-stats");
  if (st){
    const cx = codeSpeed(mode)/codeSpeed("pre"), sx = MODES.pre.lap / MODES[mode].lap;
    const fmt = x => (x >= 10 || Math.abs(x - Math.round(x)) < .05 ? String(Math.round(x)) : x.toFixed(1)) + "\u00d7";
    const tilde = mode === "future" ? "~" : "";
    const ic = {
      code:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M13.5 4l-3 16"/></svg>',
      ship:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.8-.9.7-2.3-.1-3.1-.8-.8-2.1-.8-2.9.1z"/><path d="M12 15l-3-3a22 22 0 0 1 2-4A12.9 12.9 0 0 1 22 2c0 2.7-.8 7.5-6 11a22.4 22.4 0 0 1-4 2z"/><path d="M9 12H4s.6-3 2-4c1.6-1.1 5 0 5 0M12 15v5s3-.6 4-2c1.1-1.6 0-5 0-5"/></svg>',
      wip:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5M2 17l10 5 10-5"/></svg>'
    };
    const base = mode === "pre";
    const stat = (icon, val, tip) => `<span class="stat" tabindex="0" data-tip="${tip}" aria-label="${tip}">${icon}<b>${val}</b></span>`;
    st.innerHTML =
      stat(ic.code, base ? "1\u00d7" : tilde + fmt(cx), base ? "Coding speed: the Pre\u2011AI baseline" : `Coding speed: ${tilde}${fmt(cx)} faster than Pre\u2011AI`) +
      stat(ic.ship, base ? "1\u00d7" : tilde + fmt(sx), base ? "Shipping speed: the Pre\u2011AI baseline" : `Shipping speed: ${tilde}${fmt(sx)} faster than Pre\u2011AI, from idea to production`) +
      stat(ic.wip, String(MODES[mode].n), `Items in flight: ${MODES[mode].n} pieces of work in progress at once`);
  }
}
function drawDots(){ for (const d of dots){ const [x,y] = P(RT, d.th); d.el.setAttribute("cx", x); d.el.setAttribute("cy", y);
  const r = inLoop(d.th); if (r !== d.ret){ d.ret = r; d.el.setAttribute("class", r ? "flow-dot ret" : "flow-dot"); } } }
let last = 0;
function tick(t){
  const dt = Math.min(.05, (t - last)/1000 || 0); last = t;
  if (!document.hidden){ for (const d of dots){ d.th = (d.th + speed(d.th)*dt) % 360; } drawDots(); }
  requestAnimationFrame(tick);
}
initDots();

/* =================== TERM POPOVER =================== */
let current = null, pinned = false, showT = 0, hideT = 0;
function fillPop(id){
  const t = TERMS[id];

  $("#pop-def").textContent = t.def;

function place(anchor){
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight, m = 12;
  let left = Math.min(Math.max(m, r.left + r.width/2 - 34), window.innerWidth - pw - m);
  let top = r.bottom + 12, above = false;
  if (top + ph > window.innerHeight - m && r.top - ph - 12 > m){ top = r.top - ph - 12; above = true; }
  pop.style.left = left + "px";
  pop.style.top = Math.max(m, top) + "px";
  pop.style.setProperty("--caret-x", Math.min(Math.max(14, r.left + r.width/2 - left - 6), pw - 26) + "px");
  pop.classList.toggle("above", above);
}
function openPop(anchor, pin){
  const id = anchor.dataset.term; if (!TERMS[id]) return;
  if (current && current !== anchor) current.setAttribute("aria-expanded","false");
  current = anchor; pinned = pin;
  anchor.setAttribute("aria-expanded","true");
  fillPop(id);
  $("#pop-hint").textContent = pin ? "Pinned. Press Esc or click elsewhere to close." : "Click the term to pin this.";
  pop.hidden = false;
  place(anchor);
}
function closePop(){
  clearTimeout(showT); clearTimeout(hideT);
  if (current) current.setAttribute("aria-expanded","false");
  current = null; pinned = false; pop.hidden = true;
}
document.addEventListener("mouseover", e=>{
  const t = e.target.closest(".term");
  if (t){ clearTimeout(hideT); if (current !== t && !pinned){ clearTimeout(showT); showT = setTimeout(()=>openPop(t,false), 120); } return; }
  if (e.target.closest("#pop")) clearTimeout(hideT);
});
document.addEventListener("mouseout", e=>{
  if (!e.target.closest(".term, #pop")) return;
  clearTimeout(showT);
  if (!pinned) hideT = setTimeout(closePop, 200);
});
document.addEventListener("focusin", e=>{ const t = e.target.closest(".term"); if (t && !pinned) openPop(t,false); });
document.addEventListener("focusout", e=>{
  if (e.target.closest(".term") && !pinned) hideT = setTimeout(()=>{ if (!pop.contains(document.activeElement)) closePop(); }, 120);
});
window.addEventListener("resize", ()=>{ if (current) place(current); });
document.addEventListener("scroll", ()=>{ if (current) place(current); }, true);

/* =================== GLOSSARY =================== */
const order = Object.keys(TERMS).sort((a,b)=>TERMS[a].name.localeCompare(TERMS[b].name));
let gFilter = "all", gQuery = "", gOpen = null;
const gList = $("#g-list"), gSearch = $("#g-search");
$("#g-filters").innerHTML = [["all","All"], ["era","This era"], ...PHASES.map(s=>[s.id,s.name])]
  .map(([v,l])=>`<button type="button" class="filter" data-gf="${v}" aria-pressed="${v==="all"}">${l}</button>`).join("");
function renderGlossary(){
  const q = gQuery.trim().toLowerCase();
  const ids = order.filter(id=>{
    const t = TERMS[id];
    if (gFilter === "era" && !t.modes.includes(mode)) return false;
    if (gFilter !== "all" && gFilter !== "era" && !t.stages.includes(gFilter)) return false;
    return !q || (t.name + " " + t.def + " " + t.old).toLowerCase().includes(q);
  });
  $("#g-count").textContent = (ids.length === 1 ? "1 term" : ids.length + " terms") + (gFilter === "era" ? ` used in ${MODES[mode].label}` : "");
  document.querySelectorAll("[data-gf]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.gf === gFilter)));
  if (!ids.length){ gList.innerHTML = `<p class="empty">No terms match “${esc(gQuery)}”. Try a shorter word or pick All.</p>`; return; }
  gList.innerHTML = ids.map(id=>{
    const t = TERMS[id], open = id === gOpen;
    return `<div class="g-item${open?" open":""}">
      <button type="button" class="g-head" data-gid="${id}" aria-expanded="${open}">
        <span class="g-row"><span class="g-name">${t.name}</span><span class="g-st">${modesLabel(t.modes)}</span></span>
        ${open ? "" : `<span class="g-short">${esc(t.def)}</span>`}
      </button>
      ${open ? `<div class="g-body">
        <p>${esc(t.def)}</p>
        <div class="sec"><span class="label">Example</span><p>${esc(t.ex)}</p></div>
        <div class="sec"><span class="label rose">Old idea, new name</span><p>${esc(t.old)}</p></div>
        <div class="seen"><span class="label">Go to</span>${t.stages.map(s=>`<button type="button" class="mini" data-phase="${PHASES.findIndex(x=>x.id===s)}">${stageName(s)}</button>`).join("")}</div>
      </div>` : ""}
    </div>`;
  }).join("");
}
function openGlossary(id){
  closePop();
  if (id){ gFilter = "all"; gQuery = ""; gSearch.value = ""; gOpen = id; }
  renderGlossary();
  drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false"); glossBtn.setAttribute("aria-expanded","true");
  setTimeout(()=>{ const el = id && gList.querySelector(`[data-gid="${id}"]`);
    if (el){ el.scrollIntoView({block:"center"}); el.focus({preventScroll:true}); } else gSearch.focus({preventScroll:true}); }, 80);
}
function closeGlossary(){
  drawer.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); glossBtn.setAttribute("aria-expanded","false");
  if (drawer.contains(document.activeElement)) glossBtn.focus();
}
const glossaryOpen = ()=>drawer.classList.contains("open");
glossBtn.addEventListener("click", ()=> glossaryOpen() ? closeGlossary() : openGlossary());
$("#gloss-close").addEventListener("click", closeGlossary);
gSearch.addEventListener("input", ()=>{ gQuery = gSearch.value; renderGlossary(); });



/* =================== CLICKS =================== */
document.addEventListener("click", e=>{
  if (e.target.closest(".ring")) return;
  const term = e.target.closest(".term");
  if (term){ e.preventDefault(); (current === term && pinned) ? closePop() : openPop(term, true); return; }
  const sub = e.target.closest("[data-sub]");
  if (sub){ if (drawer.contains(sub)) closeGlossary(); const [i,k] = sub.dataset.sub.split("-").map(Number); goSub(i,k); return; }
  const phb = e.target.closest("[data-phase]");
  if (phb){ if (drawer.contains(phb)) closeGlossary(); goPhase(+phb.dataset.phase); return; }
  const era = e.target.closest(".era[data-mode]");
  if (era){ setMode(era.dataset.mode); return; }
  if (e.target.closest("[data-tips]")){ goTips(); return; }
  if (e.target.closest("[data-home]")){ goOverview(); return; }
  const tf = e.target.closest("[data-tf]");
  if (tf){ tipsFilter = tf.dataset.tf; render(); return; }
  if (e.target.closest("#pop-open")){ openGlossary($("#pop-open").dataset.term); return; }
  const gf = e.target.closest("[data-gf]");
  if (gf){ gFilter = gf.dataset.gf; renderGlossary(); return; }
  const gh = e.target.closest("[data-gid]");
  if (gh){ gOpen = gOpen === gh.dataset.gid ? null : gh.dataset.gid; renderGlossary(); const el = gList.querySelector(`[data-gid="${gh.dataset.gid}"]`); el && el.focus({preventScroll:true}); return; }
  if (current && !e.target.closest("#pop")) closePop();
});

/* =================== THEME & FULL SCREEN =================== */
const themeBtn = $("#theme-btn");
function setTheme(t, save){
  root.dataset.theme = t;
  themeBtn.innerHTML = t === "dark" ? icon.sun : icon.moon;
  themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
  if (save){ try { localStorage.setItem("bwai-theme", t); } catch(e){} }
}
let savedTheme = null;
try { savedTheme = localStorage.getItem("bwai-theme"); } catch(e){}
setTheme(savedTheme || "dark", false);
const toggleTheme = ()=>setTheme(root.dataset.theme === "dark" ? "light" : "dark", true);
themeBtn.addEventListener("click", toggleTheme);
function toggleFull(){
  try { if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if (root.requestFullscreen) root.requestFullscreen().catch(()=>{}); } catch(e){}
}

/* =================== KEYBOARD =================== */
document.addEventListener("keydown", e=>{
  if (e.key === "Escape"){
    if (current){ closePop(); return; }
    if (glossaryOpen()){ closeGlossary(); return; }
    if (view === "sub") goPhase(ph); else if (view !== "overview") goOverview();
    return;
  }
  if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key, kl = k.toLowerCase();
  if (k.length === 1 && "1234".includes(k)){ goPhase(+k - 1); }
  else if (k === "["){ setMode(MODE_ORDER[Math.max(0, MODE_ORDER.indexOf(mode) - 1)]); }
  else if (k === "]"){ setMode(MODE_ORDER[Math.min(2, MODE_ORDER.indexOf(mode) + 1)]); }
  else if (k === "ArrowRight" || k === "ArrowLeft"){
    e.preventDefault(); const d = k === "ArrowRight" ? 1 : -1;
    if (view === "sub") stepSub(d); else if (view === "phase") goPhase(ph + d); else goPhase(d > 0 ? 0 : 3);
  }
  else if (k === "ArrowDown" && view === "phase"){ e.preventDefault(); goSub(ph, 0); }
  else if (k === "ArrowUp" && view === "sub"){ e.preventDefault(); goPhase(ph); }
  else if (kl === "t"){ view === "tips" ? goOverview() : goTips(); }
  else if (kl === "g"){ e.preventDefault(); glossaryOpen() ? closeGlossary() : openGlossary(); }
  else if (kl === "l"){ toggleTheme(); }
  else if (kl === "f"){ toggleFull(); }
});

/* =================== START =================== */
const h = location.hash.slice(1), mm = h.match(/^([a-z]+)-(\d)$/);
const pi = PHASES.findIndex(p=>p.id === (mm ? mm[1] : h));
if (h === "tips") goTips();
else if (mm && pi >= 0 && +mm[2] >= 1 && +mm[2] <= PHASES[pi].subs.length) goSub(pi, +mm[2] - 1);
else if (pi >= 0) goPhase(pi);
else render();
})();

</script>
