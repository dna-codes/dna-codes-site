site:
  name: DNA Codes
  site: 'https://dna.codes'
  base: '/'
  trailingSlash: false

# Default SEO metadata
metadata:
  title:
    default: DNA Codes
    template: '%s — DNA Codes'
  description: 'DNA Codes is your digital business model — define roles, processes, and rules once, and generate docs, workflows, and specs automatically.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: DNA Codes
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@dnacodes'
    site: '@dnacodes'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/blog/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"
    # Public site token from Cloudflare → Web Analytics → Manage site → JS snippet.
    # Leave null and the beacon is omitted. When set, the beacon counts ClientRouter
    # navigations itself, so do not add a second pageview.
    cloudflareWebAnalytics:
      token: '3fc2b7a2235a43a786bf67e430127fe8'

ui:
  theme: 'dark:only'
