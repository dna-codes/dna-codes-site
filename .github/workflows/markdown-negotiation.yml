# Publishes the homepage Accept: text/markdown worker onto the Cloudflare zone that
# already proxies dna.codes. GitHub Pages cannot negotiate. The workflow does nothing
# until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist; run it by hand after
# adding them. It is not on the pull-request path: `npm run check:ax` covers the build.

name: Markdown negotiation

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Deploy Cloudflare worker
        working-directory: cloudflare/markdown-negotiation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then re-run."
            echo "The token needs Workers Scripts:Edit and Workers Routes:Edit on dna.codes."
            exit 1
          fi
          npx --yes wrangler@4 deploy
