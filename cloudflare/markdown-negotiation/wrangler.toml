# Accept negotiation for https://dna.codes/ . GitHub Pages cannot do this.
# Deploy with the "Markdown negotiation" workflow, which needs CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID. The token needs Workers Scripts:Edit and the zone's
# Workers Routes:Edit. workers.dev is off: this worker exists only on the apex route.

name = "dna-codes-markdown"
main = "src/index.js"
compatibility_date = "2026-11-08"
workers_dev = false

[[routes]]
pattern = "dna.codes/"
zone_name = "dna.codes"
